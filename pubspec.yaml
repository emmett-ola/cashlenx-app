name: cashlenx
description: A cross-platform finance app.
publish_to: 'none'
version: 1.0.4+10

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # Architecture & State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  fpdart: ^1.1.0
  
  # Networking
  dio: ^5.4.0
  # retrofit: ^4.0.3 # Commented out until we setup code gen, but good to have in mind
  
  # Routing
  go_router: ^18.0.1
  
  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0
  
  # Data Classes & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^3.0.0

  # Utils
  logger: ^2.0.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.0.9
  emoji_picker_flutter: ^4.4.0
  package_info_plus: ^10.2.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  
  # Code Generation
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  # retrofit_generator: ^8.0.0
  injectable_generator: ^3.1.3
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/

  fonts:
    - family: CashLenX Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-UI.ttf
    - family: CashLenX Noto Sans TC
      fonts:
        - asset: assets/fonts/NotoSansTC-UI.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  # Canonical app icon sources. Replace these files for future seasonal or
  # holiday icon campaigns, then rerun `dart run flutter_launcher_icons`.
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#01BDB3"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
