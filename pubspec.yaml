name: cashlenx
description: A cross-platform finance app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  fpdart: ^1.1.0
  
  # Networking
  dio: ^5.4.0
  # retrofit: ^4.0.3 # Commented out until we setup code gen, but good to have in mind
  
  # Routing
  go_router: ^17.2.2
  
  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  
  # Data Classes & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  equatable: ^2.0.5

  # Utils
  logger: ^2.0.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.9
  flutter_dotenv: ^6.0.0
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  
  # Code Generation
  build_runner: ^2.14.1
  riverpod_generator: ^4.0.3
  # retrofit_generator: ^8.0.0
  injectable_generator: ^2.12.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/f9b59ca5421b2b7ef2e31c2ba4d827f48d22594a.png
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Canonical app icon source. Replace these two files for future seasonal or
  # holiday icon campaigns, then rerun `dart run flutter_launcher_icons`.
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#79BCB8"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
