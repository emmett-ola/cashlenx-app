<!-- CashLenX - Favicon and PWA Meta Tags -->
<!-- Add these tags to your index.html <head> section -->

<!-- Standard Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png.svg">

<!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json">

<!-- Theme Color -->
<meta name="theme-color" content="#008080">
<meta name="apple-mobile-web-app-status-bar-style" content="#008080">

<!-- PWA Settings -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CashLenX">
<meta name="mobile-web-app-capable" content="yes">

<!-- App Description -->
<meta name="description" content="CashLenX - Your Financial Companion. A comprehensive mobile financial management app for young professionals.">

<!-- Open Graph / Social Media -->
<meta property="og:title" content="CashLenX - Your Financial Companion">
<meta property="og:description" content="A comprehensive mobile financial management app for young professionals">
<meta property="og:type" content="website">
<meta property="og:image" content="/icon-512.png.svg">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CashLenX - Your Financial Companion">
<meta name="twitter:description" content="A comprehensive mobile financial management app for young professionals">
<meta name="twitter:image" content="/icon-512.png.svg">
