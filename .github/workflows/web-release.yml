name: Web Release

on:
  push:
    branches:
      - main
      - testing
      - develop
  workflow_dispatch:

jobs:
  build-and-publish-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: web-release-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve app environment
        id: app-env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            app_env="prod"
          elif [ "${GITHUB_REF_NAME}" = "testing" ]; then
            app_env="staging"
          else
            app_env="dev"
          fi

          if [ "$app_env" = "prod" ]; then
            api_domain="${{ vars.PROD_API_DOMAIN }}"
            api_scheme="https"
            api_port=""
          elif [ "$app_env" = "staging" ]; then
            api_domain="${{ vars.TEST_API_DOMAIN }}"
            api_scheme="https"
            api_port=""
          else
            api_domain="${{ vars.DEV_API_DOMAIN || '127.0.0.1' }}"
            api_scheme="http"
            api_port="10063"
          fi

          if [ -z "$api_domain" ]; then
            echo "Missing API domain for ${GITHUB_REF_NAME}. Configure the matching DEV_API_DOMAIN, TEST_API_DOMAIN, or PROD_API_DOMAIN repository variable." >&2
            exit 1
          fi

          {
            echo "app_env=$app_env"
            echo "api_scheme=$api_scheme"
            echo "api_domain=$api_domain"
            echo "api_port=$api_port"
            echo "api_version=api/v0"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=APP_ENV=${{ steps.app-env.outputs.app_env }} \
            --dart-define=API_SCHEME=${{ steps.app-env.outputs.api_scheme }} \
            --dart-define=API_DOMAIN=${{ steps.app-env.outputs.api_domain }} \
            --dart-define=API_PORT=${{ steps.app-env.outputs.api_port }} \
            --dart-define=API_VERSION=${{ steps.app-env.outputs.api_version }}

      - name: Select release branch
        id: release-branch
        run: |
          if [ "${{ steps.app-env.outputs.app_env }}" = "prod" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.app-env.outputs.app_env }}" = "staging" ]; then
            echo "branch=testing" >> "$GITHUB_OUTPUT"
          else
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish web build
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: emmett-ola/cashlenx-app-release
          publish_branch: ${{ steps.release-branch.outputs.branch }}
          publish_dir: ./build/web
          personal_token: ${{ secrets.RELEASE_REPO_TOKEN }}
