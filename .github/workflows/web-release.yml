name: Web Release

on:
  push:
    branches:
      - main
      - testing
      - develop
  workflow_dispatch:

jobs:
  build-and-publish-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve app environment
        id: app-env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            app_env="prod"
          elif [ "${GITHUB_REF_NAME}" = "testing" ]; then
            app_env="staging"
          else
            app_env="dev"
          fi

          if [ "$app_env" = "prod" ]; then
            api_domain="${{ vars.PROD_API_DOMAIN }}"
          elif [ "$app_env" = "staging" ]; then
            api_domain="${{ vars.TEST_API_DOMAIN }}"
          else
            api_domain="${{ vars.DEV_API_DOMAIN }}"
          fi

          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"
          echo "api_domain=$api_domain" >> "$GITHUB_OUTPUT"

      - name: Create production env file
        run: |
          {
            echo "APP_ENV=${{ steps.app-env.outputs.app_env }}"
            echo "API_SCHEME=${{ vars.API_SCHEME }}"
            echo "API_DOMAIN=${{ steps.app-env.outputs.api_domain }}"
            echo "API_PORT=${{ vars.API_PORT }}"
            echo "API_VERSION=${{ vars.API_VERSION }}"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Select release branch
        id: release-branch
        run: |
          if [ "${{ steps.app-env.outputs.app_env }}" = "prod" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.app-env.outputs.app_env }}" = "staging" ]; then
            echo "branch=testing" >> "$GITHUB_OUTPUT"
          else
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish web build
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: emmett-ola/cashlenx-app-release
          publish_branch: ${{ steps.release-branch.outputs.branch }}
          publish_dir: ./build/web
          personal_token: ${{ secrets.RELEASE_REPO_TOKEN }}
