name: ${APP_PROJECT_NAME:-cashlenx-app}

services:
  cashlenx-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        FLUTTER_BUILD_IMAGE: ${FLUTTER_BUILD_IMAGE:?FLUTTER_BUILD_IMAGE is required from docker/images.env}
        NGINX_IMAGE: ${NGINX_IMAGE:?NGINX_IMAGE is required from docker/images.env}
        GIT_COMMIT: ${GIT_COMMIT:-0000000000000000000000000000000000000000}
        PRODUCT_VERSION: ${PRODUCT_VERSION:-0.0.0}
        APP_ENV: ${APP_ENV:-dev}
        API_SCHEME: ${API_SCHEME:-http}
        API_DOMAIN: ${API_DOMAIN:-127.0.0.1}
        API_PORT: ${API_PORT:-10063}
        API_VERSION: ${API_VERSION:-api/v0}
    image: "${IMAGE_NAME:-cashlenx-web}:${IMAGE_TAG:-latest}"
    container_name: "${CONTAINER_NAME:-cashlenx-app}"
    restart: unless-stopped
    cpus: ${WEB_CPU_LIMIT:-1.0}
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    mem_reservation: ${WEB_MEMORY_RESERVATION:-256m}
    pids_limit: ${WEB_PIDS_LIMIT:-256}
    stop_grace_period: ${WEB_STOP_GRACE_PERIOD:-15s}
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-1.0}"
          memory: ${WEB_MEMORY_LIMIT:-1g}
          pids: ${WEB_PIDS_LIMIT:-256}
        reservations:
          cpus: "${WEB_CPU_RESERVATION:-0.25}"
          memory: ${WEB_MEMORY_RESERVATION:-256m}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --timeout=3 http://127.0.0.1:8080/ || exit 1"]
      interval: ${WEB_HEALTHCHECK_INTERVAL:-15s}
      timeout: ${WEB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${WEB_HEALTHCHECK_RETRIES:-3}
      start_period: ${WEB_HEALTHCHECK_START_PERIOD:-15s}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-10064}:8080"
    networks:
      - cashlenx-network

networks:
  cashlenx-network:
    name: ${DOCKER_NETWORK_NAME:-cashlenx-network}
    external: true
